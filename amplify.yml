version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline --legacy-peer-deps
        - npx prisma generate # Prisma Client を生成
    build:
      commands:
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production # DATABASE_URL を .env.production に保存
        - NODE_ENV=production npx next build # Next.js を本番モードでビルド
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm
